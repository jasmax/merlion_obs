version: 2.1

# Every push: run evals + regression gate, publish both dashboards as build artifacts.
# main only, after the gate passes: deploy to Railway.
#
# Secrets live in a CircleCI context named "merlion":
#   ANTHROPIC_API_KEY   only needed once the agent makes real Claude calls (merlion_obs/llm.py)
#   RAILWAY_TOKEN       a Railway *project* token for the production environment

jobs:
  gate:
    docker:
      - image: cimg/python:3.12
    environment:
      LLM_MODE: replay
      LLM_CACHE: /home/circleci/project/llm_cache.db
    steps:
      - checkout
      - restore_cache:
          keys:
            - pip-{{ checksum "requirements.txt" }}
      - run: pip install -r requirements.txt
      - save_cache:
          key: pip-{{ checksum "requirements.txt" }}
          paths: [~/.cache/pip]
      - restore_cache:            # recorded Claude responses: unchanged agents replay, so diffs stay exact
          keys:
            - llm-cache-{{ .Branch }}-
            - llm-cache-main-
      - run:
          name: Evals and regression gate (fails the build if blocked)
          command: chmod +x ci_gate.sh && ./ci_gate.sh
      - save_cache:
          key: llm-cache-{{ .Branch }}-{{ .Revision }}
          paths: [llm_cache.db]
      - run:
          name: Build dashboards
          when: always
          command: python build_dashboard.py && DEVOBS_DB=out_dev/ci.db python build_dev_dashboard.py
      - store_artifacts:
          path: out/dashboard.html
          destination: dashboards/production.html
      - store_artifacts:
          path: out_dev/dev_dashboard.html
          destination: dashboards/dev.html

  deploy:
    docker:
      - image: ghcr.io/railwayapp/cli:latest   # pin a version tag once you have one working
    steps:
      - checkout
      - run:
          name: Deploy to Railway
          command: railway up --ci --service merlion-obs

workflows:
  gate-and-deploy:
    jobs:
      - gate:
          context: merlion
      - deploy:
          context: merlion
          requires: [gate]
          filters:
            branches:
              only: main
